<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#315b9d">
<title>PACES Pukka Pad</title>
<style>
:root{--blue:#315b9d;--blue2:#24497f;--bg:#f5f1e9;--paper:#fffdf8;--line:#ddd6ca;--muted:#6b7280;--green:#2f6f52;--amber:#9a6a17;--red:#9b3c34}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,var(--bg),#ece7de);color:#1f2937;min-height:100vh}button,input,textarea,select{font:inherit}.hidden{display:none!important}.wrap{max-width:1360px;margin:auto;padding:20px}.row,.top{display:flex;gap:8px;flex-wrap:wrap}.top{justify-content:space-between;align-items:flex-start}.btn{border:1px solid var(--line);background:var(--paper);padding:9px 12px;border-radius:10px;font-weight:750;cursor:pointer}.btn:hover{background:#fff}.pri{background:var(--blue);border-color:var(--blue);color:white}.pri:hover{background:var(--blue2)}.danger{color:var(--red)}
.layout{display:grid;grid-template-columns:250px 1fr;gap:17px;margin-top:16px}.side,.main,.card,.auth,.modal,.practice{background:var(--paper);border:1px solid var(--line);border-radius:16px}.side{padding:12px;height:max-content;position:sticky;top:12px}.side button{width:100%;text-align:left;margin:2px 0;border:0;background:transparent;padding:10px;border-radius:10px}.side button.on{background:#eaf0fb;color:var(--blue);font-weight:850}.navlabel{font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:#8b8172;padding:8px 10px}.count{float:right;background:#ebe6dc;border-radius:999px;padding:2px 7px;font-size:11px}.main{padding:20px;min-height:78vh}.muted{font-size:12px;color:var(--muted)}.sync{display:inline-block;margin-top:8px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:12px}.sync.ok{color:var(--green)}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.head h2{margin:0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tools input{flex:1;min-width:220px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fffdf9}textarea{min-height:90px;resize:vertical}.paper{position:relative;margin:15px 0;padding:12px 12px 12px 58px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(to right,transparent 0 46px,#c33d3d22 46px 47px,transparent 47px),repeating-linear-gradient(to bottom,#fffdf8 0 30px,#dfe5ec 30px 31px)}.paper textarea{border:0;background:transparent;outline:0;line-height:31px;min-height:150px;padding:0}.paper:before{content:"SECTION NOTES";position:absolute;left:13px;top:14px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:850;letter-spacing:.1em;color:#9a8f7d}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}.card{padding:14px}.card h3{margin:0 0 5px}.preview{white-space:pre-wrap;color:#4b5563;font-size:13px;line-height:1.45;margin-top:9px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:#eee9df}.tag.due{background:#fff5dc;color:var(--amber)}.tag.weak{background:#fae9e6;color:var(--red)}.tag.ready{background:#eaf5ef;color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:14px 0}.stat{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fbf8f1}.stat b{display:block;font-size:27px}.panel{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fffdf9;margin:13px 0}.panel h3{margin:0 0 10px}.quick{display:flex;flex-direction:column;gap:7px}.quickitem{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:22px}.auth{width:min(500px,100%);padding:28px}.auth h1{margin:0}.tabs{display:flex;gap:8px;margin:16px 0}.tabs .btn{flex:1}.msg{font-size:13px;color:var(--red);margin-top:10px}.shade{position:fixed;inset:0;background:#1118277a;display:grid;place-items:center;padding:16px;z-index:30}.modal{width:min(920px,100%);max-height:92vh;overflow:auto}.modalhead,.modalfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 18px}.modalhead{border-bottom:1px solid var(--line)}.modalfoot{border-top:1px solid var(--line)}.modalbody{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:850;color:#5f574c;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}.notes{min-height:170px;background:repeating-linear-gradient(to bottom,#fffdf8 0 29px,#dfe5ec 29px 30px);line-height:30px}.practice{width:min(900px,100%);max-height:92vh;overflow:auto;padding:18px}.prompt{padding:14px;background:#eaf0fb;border:1px solid #cbd8f0;border-radius:11px;white-space:pre-wrap;margin:10px 0}details{border:1px solid var(--line);border-radius:11px;background:#fff;margin:8px 0}summary{cursor:pointer;padding:11px 13px;font-weight:800}.detail{padding:0 13px 13px;white-space:pre-wrap;line-height:1.5}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:13px;color:var(--muted)}
@media(max-width:880px){.top{flex-direction:column}.layout,.grid,.stats{grid-template-columns:1fr}.side{position:static}.side .navgrid{display:grid;grid-template-columns:repeat(2,1fr)}}
</style>
</head><body>
<div id="authView" class="authwrap"><div class="auth"><h1>PACES Pukka Pad</h1><p class="muted">Private synced PACES revision notebook.</p><div class="tabs"><button class="btn pri" id="tabIn">Sign in</button><button class="btn" id="tabUp">Create account</button></div><form id="authForm"><label>Email</label><input id="email" type="email" required autocomplete="email"><label style="margin-top:10px">Password</label><input id="pass" type="password" minlength="8" required><button id="authSubmit" class="btn pri" style="margin-top:12px;width:100%">Sign in</button></form><div id="authMsg" class="msg"></div></div></div>

<div id="app" class="wrap hidden"><div class="top"><div><h1 style="margin:0">PACES Pukka Pad</h1><div class="muted">Private synced case bank + active recall + spaced review</div><div id="sync" class="sync">Connecting...</div></div><div class="row"><button class="btn pri" id="randomBtn">Random case</button><button class="btn" id="dueBtn">Due review</button><button class="btn" id="exportBtn">Export backup</button><label class="btn">Import backup<input id="importFile" type="file" accept=".json" hidden></label><button class="btn danger" id="logout">Sign out</button></div></div><div class="layout"><aside class="side"><div class="navlabel">Revision</div><div id="topNav" class="navgrid"></div><div class="navlabel">Sections</div><div id="nav" class="navgrid"></div></aside><main id="main" class="main"></main></div></div>

<div id="editShade" class="shade hidden"><div class="modal"><div class="modalhead"><h2 id="editHeading" style="margin:0">Add case</h2><button class="btn" id="closeEdit">Close</button></div><div class="modalbody"><div class="grid"><div class="full"><label>Case / diagnosis title</label><input id="ctitle"></div><div class="full"><label>Blind candidate prompt</label><textarea id="prompt"></textarea></div><div><label>Key examination findings</label><textarea id="findings"></textarea></div><div><label>20-30 second PACES presentation</label><textarea id="presentation"></textarea></div><div><label>Differentials / causes</label><textarea id="diffs"></textarea></div><div><label>Specific investigations</label><textarea id="ix"></textarea></div><div><label>Basic management</label><textarea id="mgmt"></textarea></div><div><label>Complications / severity markers</label><textarea id="comp"></textarea></div><div class="full"><label>Viva questions & your answers</label><textarea id="viva"></textarea></div><div class="full"><label>Free notes</label><textarea id="notes" class="notes"></textarea></div><div><label>Confidence 0-5</label><input id="conf" type="number" min="0" max="5" value="0"></div><div><label>Tags, comma separated</label><input id="tags"></div><div class="full"><label style="text-transform:none;letter-spacing:0"><input id="seen" type="checkbox" style="width:auto"> I have seen / examined a real patient with this condition</label></div></div></div><div class="modalfoot"><button class="btn danger" id="deleteBtn">Delete case</button><button class="btn pri" id="saveBtn">Save case</button></div></div></div>

<div id="practiceShade" class="shade hidden"><div class="practice"><div class="row"><div style="flex:1"><div id="psec" class="muted"></div><h2 id="ptitle" style="margin:2px 0 8px">Blind case</h2></div><button class="btn" id="closePractice">Close</button></div><div id="pprompt" class="prompt"></div><div id="reveals"></div><div class="panel"><strong>How well did you know this case?</strong><div class="muted">This schedules the next review automatically.</div><div class="row" style="margin-top:8px"><button class="btn" data-rate="1">1 - Blank</button><button class="btn" data-rate="2">2 - Weak</button><button class="btn" data-rate="3">3 - Fair</button><button class="btn" data-rate="4">4 - Good</button><button class="btn" data-rate="5">5 - Automatic</button></div></div></div></div>

<script>
const API='https://uhjpktsbdxaknvjmsfmu.supabase.co/functions/v1/paces-api';
const SECTIONS={cardiology:{name:'Cardiology',desc:'Murmurs, valve disease, cardiomyopathy, heart failure and devices'},respiratory:{name:'Respiratory',desc:'Obstructive, restrictive, pleural and surgical respiratory cases'},abdomen:{name:'Abdomen',desc:'Liver, spleen, renal, transplant and other abdominal signs'},neurology:{name:'Neurology',desc:'Upper limb, lower limb, gait, cranial nerves and localisation'},consultation:{name:'Common Consultation Stations',desc:'Focused history, examination, management and patient concerns'}};
const el=id=>document.getElementById(id);let session=JSON.parse(localStorage.getItem('paces_session')||'null'),state=blank(),active='cardiology',view='dashboard',edit=null,practice=null,saveTimer=null,authMode='signin';
function blank(){const s={cases:{},notes:{},settings:{examDate:'2026-11-08'}};Object.keys(SECTIONS).forEach(k=>{s.cases[k]=[];s.notes[k]=''});return s}
function normalize(x){const b=blank();Object.keys(SECTIONS).forEach(k=>{b.cases[k]=Array.isArray(x?.cases?.[k])?x.cases[k]:[];b.notes[k]=x?.notes?.[k]||x?.sectionNotes?.[k]||''});b.settings.examDate=x?.settings?.examDate||'2026-11-08';return b}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function syncText(t,ok=false){el('sync').textContent=t;el('sync').className='sync '+(ok?'ok':'')}
async function call(action,data={},retry=true){const headers={'Content-Type':'application/json'};if(session?.access_token)headers.Authorization='Bearer '+session.access_token;let r=await fetch(API,{method:'POST',headers,body:JSON.stringify({action,...data})});if(r.status===401&&retry&&session?.refresh_token){const rr=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'refresh',refreshToken:session.refresh_token})}),jj=await rr.json().catch(()=>({}));if(rr.ok&&jj.session){session=jj.session;localStorage.setItem('paces_session',JSON.stringify(session));return call(action,data,false)}}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function setAuth(mode){authMode=mode;el('tabIn').className='btn '+(mode==='signin'?'pri':'');el('tabUp').className='btn '+(mode==='signup'?'pri':'');el('authSubmit').textContent=mode==='signin'?'Sign in':'Create account';el('authMsg').textContent=''}
async function doAuth(){const email=el('email').value.trim(),password=el('pass').value;el('authMsg').textContent='Working...';try{const j=await call(authMode==='signup'?'signup':'signin',{email,password,redirectTo:location.href},false);if(j.session){session=j.session;localStorage.setItem('paces_session',JSON.stringify(session));showApp();await load()}else el('authMsg').textContent='Account created. Confirm your email if asked, then return here and sign in.'}catch(e){el('authMsg').textContent=e.message}}
function logout(){session=null;localStorage.removeItem('paces_session');el('app').classList.add('hidden');el('authView').classList.remove('hidden')}
function showApp(){el('authView').classList.add('hidden');el('app').classList.remove('hidden');render()}
async function load(){syncText('Loading...');try{const j=await call('load');if(j.data)state=normalize(j.data);else await saveCloud();render();syncText('Synced',true)}catch(e){syncText('Sync error');if(String(e.message).includes('signed')||String(e.message).includes('session'))logout()}}
function queue(){syncText('Unsaved changes');clearTimeout(saveTimer);saveTimer=setTimeout(saveCloud,500)}
async function saveCloud(){if(!session)return;syncText('Saving...');try{await call('save',{data:state});syncText('Synced',true)}catch(e){syncText('Sync error')}}
function all(){return Object.entries(state.cases).flatMap(([section,a])=>a.map(c=>({...c,section})))}
function isDue(c){return c.nextReview?new Date(c.nextReview)<=new Date():((c.confidence||0)>0&&(c.confidence||0)<=2)}
function daysLeft(){const d=new Date((state.settings.examDate||'2026-11-08')+'T00:00:00'),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.ceil((d-t)/86400000)}
function renderNav(){const top=el('topNav');top.innerHTML='';[['dashboard','Dashboard'],['due','Due review']].forEach(([k,l])=>{const b=document.createElement('button');b.className=view===k?'on':'';b.innerHTML=l+(k==='due'?'<span class="count">'+all().filter(isDue).length+'</span>':'');b.onclick=()=>{view=k;render()};top.appendChild(b)});const nav=el('nav');nav.innerHTML='';Object.entries(SECTIONS).forEach(([k,v])=>{const b=document.createElement('button');b.className=view==='section'&&active===k?'on':'';b.innerHTML=esc(v.name)+'<span class="count">'+state.cases[k].length+'</span>';b.onclick=()=>{active=k;view='section';render()};nav.appendChild(b)})}
function render(){if(!session?.access_token)return;renderNav();if(view==='dashboard')renderDashboard();else if(view==='due')renderDue();else renderSection()}
function renderDashboard(){const a=all(),due=a.filter(isDue),weak=a.filter(c=>c.confidence>0&&c.confidence<=2),ready=a.filter(c=>c.confidence>=4),seen=a.filter(c=>c.seen);el('main').innerHTML='<div class="head"><div><h2>Revision dashboard</h2><div class="muted">'+Math.max(daysLeft(),0)+' days to exam</div></div><button class="btn pri" id="dashRandom">Start random case</button></div><div class="stats"><div class="stat"><b>'+a.length+'</b><span class="muted">Total cases</span></div><div class="stat"><b>'+due.length+'</b><span class="muted">Due review</span></div><div class="stat"><b>'+weak.length+'</b><span class="muted">Low confidence</span></div><div class="stat"><b>'+ready.length+'</b><span class="muted">High confidence</span></div></div><div class="panel"><h3>Today\'s best targets</h3><div id="targets" class="quick"></div></div><div class="panel"><h3>Real-patient exposure</h3><div style="font-size:28px;font-weight:850">'+seen.length+' / '+a.length+'</div></div>';const box=el('targets'),rank=[...a].sort((x,y)=>(isDue(y)?1:0)-(isDue(x)?1:0)||(x.confidence||0)-(y.confidence||0)).slice(0,6);if(!rank.length)box.innerHTML='<div class="empty">Add your first case.</div>';else rank.forEach(c=>{const d=document.createElement('div');d.className='quickitem';d.innerHTML='<div><b>'+esc(c.title)+'</b><div class="muted">'+esc(SECTIONS[c.section].name)+' · confidence '+(c.confidence||0)+'/5</div></div><button class="btn">Practise</button>';d.querySelector('button').onclick=()=>openPractice(c);box.appendChild(d)});el('dashRandom').onclick=()=>openPractice(randomCase())}
function renderSection(){el('main').innerHTML='<div class="head"><div><h2>'+esc(SECTIONS[active].name)+'</h2><div class="muted">'+esc(SECTIONS[active].desc)+'</div></div><button class="btn pri" id="addCase">+ Add case</button></div><div class="paper"><textarea id="sectionNotes" placeholder="Useful phrases, viva reminders, things you keep forgetting..."></textarea></div><div class="tools"><input id="search" placeholder="Search cases and notes..."><button class="btn" id="sectionRandom">Practise section</button></div><div id="cards" class="cards"></div>';el('sectionNotes').value=state.notes[active]||'';el('sectionNotes').oninput=e=>{state.notes[active]=e.target.value;queue()};el('addCase').onclick=()=>openEdit();el('search').oninput=renderCards;el('sectionRandom').onclick=()=>openPractice(randomCase(active));renderCards()}
function renderCards(){const box=el('cards'),q=(el('search')?.value||'').toLowerCase();box.innerHTML='';const a=state.cases[active].filter(c=>JSON.stringify(c).toLowerCase().includes(q));if(!a.length){box.innerHTML='<div class="empty">No matching cases.</div>';return}a.sort((x,y)=>(y.updated||0)-(x.updated||0)).forEach(c=>{const d=document.createElement('div');d.className='card';let tags=(c.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');if(isDue(c))tags+='<span class="tag due">Due review</span>';if(c.confidence>0&&c.confidence<=2)tags+='<span class="tag weak">Low confidence</span>';if(c.confidence>=4)tags+='<span class="tag ready">Ready</span>';d.innerHTML='<h3>'+esc(c.title)+'</h3><div class="muted">Confidence '+(c.confidence||0)+'/5 · reviews '+(c.reviewCount||0)+'</div><div class="preview">'+esc((c.presentation||c.findings||c.notes||'').slice(0,230))+'</div><div class="tags">'+tags+'</div><div class="row" style="margin-top:9px"><button class="btn p">Practise</button><button class="btn e">Edit</button></div>';d.querySelector('.p').onclick=()=>openPractice({...c,section:active});d.querySelector('.e').onclick=()=>openEdit(c.id);box.appendChild(d)})}
function renderDue(){const a=all().filter(isDue);el('main').innerHTML='<div class="head"><div><h2>Due review</h2><div class="muted">Weak or scheduled cases that should come back today.</div></div><button class="btn pri" id="dueRandom">Practise due case</button></div><div id="dueCards" class="cards" style="margin-top:14px"></div>';const box=el('dueCards');if(!a.length)box.innerHTML='<div class="empty">Nothing is due right now.</div>';else a.forEach(c=>{const d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+esc(c.title)+'</h3><div class="muted">'+esc(SECTIONS[c.section].name)+' · confidence '+(c.confidence||0)+'/5</div><button class="btn" style="margin-top:9px">Practise</button>';d.querySelector('button').onclick=()=>openPractice(c);box.appendChild(d)});el('dueRandom').onclick=()=>openPractice(randomCase(null,true))}
function openEdit(id=null){edit=id;const c=id?state.cases[active].find(x=>x.id===id):{};el('editHeading').textContent=id?'Edit case':'Add case';el('deleteBtn').style.visibility=id?'visible':'hidden';[['ctitle','title'],['prompt','prompt'],['findings','findings'],['presentation','presentation'],['diffs','differentials'],['ix','investigations'],['mgmt','management'],['comp','complications'],['viva','viva'],['notes','notes']].forEach(([i,k])=>el(i).value=c[k]||'');el('conf').value=c.confidence||0;el('tags').value=(c.tags||[]).join(', ');el('seen').checked=!!c.seen;el('editShade').classList.remove('hidden')}
function closeEdit(){el('editShade').classList.add('hidden')}
function saveCase(){if(!el('ctitle').value.trim())return alert('Add a title');const old=edit?state.cases[active].find(x=>x.id===edit):{},c={...old,id:edit||crypto.randomUUID(),title:el('ctitle').value.trim(),prompt:el('prompt').value,findings:el('findings').value,presentation:el('presentation').value,differentials:el('diffs').value,investigations:el('ix').value,management:el('mgmt').value,complications:el('comp').value,viva:el('viva').value,notes:el('notes').value,confidence:+el('conf').value||0,tags:el('tags').value.split(',').map(x=>x.trim()).filter(Boolean),seen:el('seen').checked,created:old.created||Date.now(),updated:Date.now(),reviewCount:old.reviewCount||0};if(edit){const i=state.cases[active].findIndex(x=>x.id===edit);state.cases[active][i]=c}else state.cases[active].push(c);queue();closeEdit();render()}
function delCase(){if(edit&&confirm('Delete this case?')){state.cases[active]=state.cases[active].filter(x=>x.id!==edit);queue();closeEdit();render()}}
function reveal(t,v){return '<details><summary>'+t+'</summary><div class="detail">'+(v?esc(v):'<span class="muted">Nothing written yet.</span>')+'</div></details>'}
function openPractice(c){if(!c)return alert('Add a case first.');practice=c;el('psec').textContent=SECTIONS[c.section].name;el('ptitle').textContent=c.prompt?'Blind case':c.title;el('pprompt').textContent=c.prompt||'Answer aloud before revealing each section.';el('reveals').innerHTML=reveal('Diagnosis / title',c.title)+reveal('Key examination findings',c.findings)+reveal('20-30 second PACES presentation',c.presentation)+reveal('Differentials / causes',c.differentials)+reveal('Specific investigations',c.investigations)+reveal('Basic management',c.management)+reveal('Complications / severity',c.complications)+reveal('Viva Q&A',c.viva)+reveal('Free notes',c.notes);el('practiceShade').classList.remove('hidden')}
function randomCase(section=null,onlyDue=false){let a=section?state.cases[section].map(c=>({...c,section})):all();a=a.filter(c=>!onlyDue||isDue(c));if(!a.length)return null;let pool=[];a.forEach(c=>{let w=isDue(c)?4:1;if((c.confidence||0)===0)w=3;else if(c.confidence<=2)w+=2;for(let i=0;i<w;i++)pool.push(c)});return pool[Math.floor(Math.random()*pool.length)]}
function rate(r){if(!practice)return;const i=state.cases[practice.section].findIndex(x=>x.id===practice.id),days={1:1,2:2,3:4,4:7,5:14}[r],n=new Date();n.setDate(n.getDate()+days);Object.assign(state.cases[practice.section][i],{confidence:r,lastReviewed:Date.now(),nextReview:n.toISOString(),reviewCount:(state.cases[practice.section][i].reviewCount||0)+1,updated:Date.now()});queue();el('practiceShade').classList.add('hidden');render()}
el('tabIn').onclick=()=>setAuth('signin');el('tabUp').onclick=()=>setAuth('signup');el('authForm').onsubmit=e=>{e.preventDefault();doAuth()};el('logout').onclick=logout;el('closeEdit').onclick=closeEdit;el('saveBtn').onclick=saveCase;el('deleteBtn').onclick=delCase;el('closePractice').onclick=()=>el('practiceShade').classList.add('hidden');el('randomBtn').onclick=()=>openPractice(randomCase());el('dueBtn').onclick=()=>openPractice(randomCase(null,true));document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(+b.dataset.rate));el('exportBtn').onclick=()=>{const a=document.createElement('a'),blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='paces-pukka-pad-backup.json';a.click()};el('importFile').onchange=async e=>{try{state=normalize(JSON.parse(await e.target.files[0].text()));queue();render();alert('Backup imported and synced.')}catch{alert('Could not read backup.')}e.target.value=''};
(async()=>{if(session?.access_token){showApp();await load()}else{el('authView').classList.remove('hidden');el('app').classList.add('hidden')}})();
</script></body></html>
